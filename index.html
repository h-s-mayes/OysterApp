<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Data Collection App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 font-sans">

  <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6 mt-4">
    <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">New Entry</h2>

    <form id="uploadForm" class="space-y-4">
      
      <!-- Passcode Input -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Access Passcode</label>
        <input type="password" id="passcodeInput" required placeholder="Enter team passcode"
               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
      </div>

      <!-- Photo Capture -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Photo</label>
        <input type="file" id="imageInput" accept="image/*" capture="environment" 
               class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        <img id="imagePreview" class="mt-3 rounded-md w-full hidden object-cover" style="max-height: 250px;" />
      </div>

      <!-- Name Input -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
        <input type="text" id="nameInput" required
               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
      </div>

      <!-- Length Input -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Length</label>
        <input type="number" id="lengthInput" required
               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
      </div>

      <!-- Location Dropdown -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Location</label>
        <select id="locationInput" required
                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 bg-white">
          <option value="" disabled selected>Select a location...</option>
          <option value="Site A">Site A</option>
          <option value="Site B">Site B</option>
        </select>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn" 
              class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 mt-4">
        Submit Data
      </button>

      <div id="statusMessage" class="text-center font-medium mt-2 hidden"></div>
    </form>
  </div>

  <script>
    const scriptUrl = "https://script.google.com/macros/s/AKfycbzZ3D_MdAnidvCM5wu-lARMKXiHYlQVaP04KQ2r88jtMMUgQ-FEEOqkSmXjUqPph0WZXA/exec";
    let base64ImageString = "";

    // Automatically fill the saved passcode if they entered it previously
    const savedPasscode = localStorage.getItem('field_app_passcode');
    if (savedPasscode) {
      document.getElementById('passcodeInput').value = savedPasscode;
    }

    document.getElementById('imageInput').addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const imgPreview = document.getElementById('imagePreview');
          imgPreview.src = e.target.result;
          imgPreview.classList.remove('hidden');
          base64ImageString = e.target.result.split(',')[1];
        };
        reader.readAsDataURL(file);
      }
    });

    document.getElementById('uploadForm').addEventListener('submit', async function(event) {
      event.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      const statusMessage = document.getElementById('statusMessage');
      const passcode = document.getElementById('passcodeInput').value;
      
      if (!base64ImageString) {
        alert("Please take a photo first.");
        return;
      }

      // Remember the passcode on this device
      localStorage.setItem('App_passcode', passcode);

      const payload = {
        passcode: passcode,
        name: document.getElementById('nameInput').value,
        length: document.getElementById('lengthInput').value,
        location: document.getElementById('locationInput').value,
        image: base64ImageString
      };

      submitBtn.disabled = true;
      submitBtn.innerText = "Uploading...";
      statusMessage.classList.add('hidden');

      try {
        await fetch(scriptUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        statusMessage.innerText = "Submitted! (Check sheet to confirm passcode matched)";
        statusMessage.className = "text-center font-medium mt-2 text-green-600";
        
        // Clear fields except passcode
        document.getElementById('nameInput').value = "";
        document.getElementById('lengthInput').value = "";
        document.getElementById('locationInput').value = "";
        document.getElementById('imageInput').value = "";
        document.getElementById('imagePreview').classList.add('hidden');
        base64ImageString = "";

      } catch (error) {
        statusMessage.innerText = "Upload Failed. Check internet or passcode.";
        statusMessage.className = "text-center font-medium mt-2 text-red-600";
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Submit Data";
        statusMessage.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
