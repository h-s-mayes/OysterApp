<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Oyster Data Collection</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 font-sans pb-12">

  <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6 mt-4">
    <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Oyster Entry</h2>

    <form id="uploadForm" class="space-y-6">
      
      <!-- Passcode Input -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Access Passcode</label>
        <input type="password" id="passcodeInput" required placeholder="Enter team passcode"
               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
      </div>

      <!-- Photo Capture -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Photo</label>
        <input type="file" id="imageInput" accept="image/*" capture="environment" required
               class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        <img id="imagePreview" class="mt-3 rounded-md w-full hidden object-cover" style="max-height: 250px;" />
      </div>

      <!-- SECTION 1: Site Info -->
      <div class="bg-gray-50 p-4 rounded-md border border-gray-200 space-y-4">
        <h3 class="font-bold text-gray-700 border-b pb-1">Site Information</h3>
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Harbour Location</label>
          <select id="harbourInput" required class="w-full px-3 py-2 border border-gray-300 rounded-md bg-white">
            <option value="" disabled selected>Select harbour...</option>
            <option value="Chichester">Chichester</option>
            <option value="Hamble">Hamble</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Site Type</label>
          <select id="siteTypeInput" required class="w-full px-3 py-2 border border-gray-300 rounded-md bg-white">
            <option value="" disabled selected>Select site type...</option>
            <option value="Oyster Reef">Oyster Reef</option>
            <option value="Control">Control</option>
          </select>
        </div>
      </div>

      <!-- SECTION 2: Sample Details -->
      <div class="bg-blue-50 p-4 rounded-md border border-blue-100 space-y-4">
        <h3 class="font-bold text-blue-800 border-b border-blue-200 pb-1">Sample Details</h3>
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Sample ID</label>
          <input type="text" id="sampleIdInput" required placeholder="e.g. S-102"
                 class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm">
        </div>

        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">Coupelle (1-5)</label>
            <input type="number" id="coupelleInput" min="1" max="5" required
                   class="w-full px-2 py-2 border border-gray-300 rounded-md text-center">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">Stack (1-9)</label>
            <input type="number" id="stackInput" min="1" max="9" required
                   class="w-full px-2 py-2 border border-gray-300 rounded-md text-center">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">Disc (1-6)</label>
            <input type="number" id="discInput" min="1" max="6" required
                   class="w-full px-2 py-2 border border-gray-300 rounded-md text-center">
          </div>
        </div>
      </div>

      <!-- SECTION 3: Oyster Metrics -->
      <div class="bg-green-50 p-4 rounded-md border border-green-100 space-y-4">
        <h3 class="font-bold text-green-800 border-b border-green-200 pb-1">Oyster Metrics</h3>
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Identification (Species)</label>
          <select id="speciesInput" required class="w-full px-3 py-2 border border-gray-300 rounded-md bg-white shadow-sm">
            <option value="" disabled selected>Select species...</option>
            <option value="Crassostrea gigas">Crassostrea gigas</option>
            <option value="Ostrea edulis">Ostrea edulis</option>
            <option value="Anomia ephippium">Anomia ephippium</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Height (mm)</label>
            <input type="number" id="heightInput" step="0.1" required
                   class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Length (mm)</label>
            <input type="number" id="lengthInput" step="0.1" required
                   class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm">
          </div>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn" 
              class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-md hover:bg-blue-700 mt-4 shadow-lg">
        Submit Data
      </button>

      <div id="statusMessage" class="text-center font-medium mt-2 hidden"></div>
    </form>
  </div>

  <script>
    const scriptUrl = "https://script.google.com/macros/s/AKfycbzZ3D_MdAnidvCM5wu-lARMKXiHYlQVaP04KQ2r88jtMMUgQ-FEEOqkSmXjUqPph0WZXA/exec";
    let base64ImageString = "";

    // Load passcode
    const savedPasscode = localStorage.getItem('field_app_passcode');
    if (savedPasscode) document.getElementById('passcodeInput').value = savedPasscode;

    // Image logic
    document.getElementById('imageInput').addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const imgPreview = document.getElementById('imagePreview');
          imgPreview.src = e.target.result;
          imgPreview.classList.remove('hidden');
          base64ImageString = e.target.result.split(',')[1];
        };
        reader.readAsDataURL(file);
      }
    });

    // Form logic
    document.getElementById('uploadForm').addEventListener('submit', async function(event) {
      event.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      const statusMessage = document.getElementById('statusMessage');
      const passcode = document.getElementById('passcodeInput').value;
      
      if (!base64ImageString) return alert("Please take a photo first.");

      localStorage.setItem('field_app_passcode', passcode);

      // Package ALL the new fields
      const payload = {
        passcode: passcode,
        harbour: document.getElementById('harbourInput').value,
        siteType: document.getElementById('siteTypeInput').value,
        sampleId: document.getElementById('sampleIdInput').value,
        coupelle: document.getElementById('coupelleInput').value,
        stack: document.getElementById('stackInput').value,
        disc: document.getElementById('discInput').value,
        species: document.getElementById('speciesInput').value,
        height: document.getElementById('heightInput').value,
        length: document.getElementById('lengthInput').value,
        image: base64ImageString
      };

      submitBtn.disabled = true;
      submitBtn.innerText = "Uploading...";
      statusMessage.classList.add('hidden');

      try {
        await fetch(scriptUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        statusMessage.innerText = "Submitted Successfully!";
        statusMessage.className = "text-center font-medium mt-2 text-green-600";
        
        // Reset the form (keeping passcode)
        setTimeout(() => {
          document.getElementById('uploadForm').reset();
          document.getElementById('passcodeInput').value = passcode; 
          document.getElementById('imagePreview').classList.add('hidden');
          base64ImageString = "";
        }, 1500);

      } catch (error) {
        statusMessage.innerText = "Upload Failed. Check internet or passcode.";
        statusMessage.className = "text-center font-medium mt-2 text-red-600";
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Submit Data";
        statusMessage.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
